<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Start Your Project — AI Intake Assistant</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 20px;
    }
    .container {
      width: 100%; max-width: 620px; background: var(--card);
      border: 1px solid var(--border); border-radius: 16px;
      padding: 26px; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 6px; font-size: 1.45rem; }
    p.sub { margin: 0 0 14px; color: var(--muted); font-size: 0.92rem; line-height: 1.45; }
    .voice-toggle {
      display: inline-flex; align-items: center; gap: 6px; font-size: 0.84rem;
      color: var(--muted); margin-bottom: 12px; cursor: pointer;
    }
    .messages {
      height: 340px; overflow-y: auto; display: flex; flex-direction: column;
      gap: 12px; padding: 12px; background: #0f172a;
      border: 1px solid var(--border); border-radius: 12px; margin-bottom: 14px;
    }
    .msg {
      max-width: 85%; padding: 12px 15px; border-radius: 12px;
      font-size: 0.94rem; line-height: 1.45; white-space: pre-wrap;
    }
    .msg.ai { background: #1e293b; border: 1px solid var(--border); align-self: flex-start; }
    .msg.user { background: var(--accent); color: white; align-self: flex-end; }
    .quick-options {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px;
    }
    .option-btn {
      padding: 9px 14px; border-radius: 999px; border: 1px solid var(--accent);
      background: rgba(59, 130, 246, 0.14); color: #93c5fd;
      font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: 0.15s;
    }
    .option-btn:hover { background: var(--accent); color: white; }
    .input-row { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
      background: #0f172a; color: var(--text); font-size: 0.95rem; outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    button.action {
      padding: 0 16px; border-radius: 10px; border: none; font-weight: 600;
      cursor: pointer; background: var(--accent); color: white; transition: 0.15s;
    }
    button.action:hover { background: var(--accent-hover); }
    button.action:disabled { opacity: 0.5; cursor: not-allowed; }
    button.mic { background: #334155; font-size: 1.1rem; }
    button.mic.listening { background: #ef4444; animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { opacity: 0.6; } }
  </style>
</head>
<body>

<div class="container">
  <h1>Tell Us About Your Project</h1>
  <p class="sub">Chat or speak with our AI intake assistant—it will clarify your goals and email a structured brief straight to our developer.</p>

  <label class="voice-toggle">
    <input type="checkbox" id="tts-toggle" /> Read AI questions aloud
  </label>

  <div class="messages" id="messages"></div>

  <div class="quick-options" id="quick-options">
    <button type="button" class="option-btn" onclick="submitValue('New Project')">New Project</button>
    <button type="button" class="option-btn" onclick="submitValue('Existing Project')">Existing Project</button>
    <button type="button" class="option-btn" onclick="submitValue('Troubleshoot')">Troubleshoot</button>
  </div>

  <div class="input-row" id="input-controls">
    <button class="action mic" id="mic-btn" title="Speak answer" onclick="toggleMic()">🎤</button>
    <input type="text" id="user-input" placeholder="Type or tap mic to speak..." onkeydown="if(event.key==='Enter') sendAnswer()" />
    <button class="action" id="send-btn" onclick="sendAnswer()">Send</button>
  </div>
</div>

<script>
  const WORKER_URL = "https://groq-intake-proxy.usproblogger.workers.dev/";
  const WEB3FORMS_KEY = "7393fec3-3022-4eea-bdef-224842265d47";

  const SYSTEM_PROMPT = `You are a friendly, sharp web development intake concierge.
Your goal is to collect 5 pieces of info from the client naturally, asking ONE concise question at a time (1-2 sentences max per reply):
1. Project Type: New Project, Existing Project, or Troubleshoot.
2. Core Objective: What they want built, updated, or fixed on the web.
3. Constraints: Target timeline and rough budget range.
4. Existing Materials: Domain, branding, tech stack, or example sites they already have.
5. Contact Info: Their name and best email address for the developer to follow up.

Rules:
- Acknowledge what the user just said briefly, then ask for the next missing item.
- Skip any item the user already answered.
- Once ALL 5 items are collected, output ONLY a valid JSON block (no extra text before or after) in this exact format:
{"done":true,"project_type":"...","objective":"...","constraints":"...","materials":"...","contact":"...","summary":"2-sentence executive summary for the developer"}`;

  let conversation = [
    { role: "system", content: SYSTEM_PROMPT },
    { role: "assistant", content: "Hi there! Is this a new project, an existing project, or something you need to troubleshoot?" }
  ];

  function addMessage(text, sender) {
    const box = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = `msg ${sender}`;
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;

    if (sender === "ai" && document.getElementById("tts-toggle").checked && "speechSynthesis" in window) {
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
    }
  }

  function setBusy(busy) {
    document.getElementById("send-btn").disabled = busy;
    document.getElementById("user-input").disabled = busy;
  }

  async function submitValue(val) {
    if (!val) return;
    document.getElementById("quick-options").style.display = "none";

    addMessage(val, "user");
    document.getElementById("user-input").value = "";
    conversation.push({ role: "user", content: val });

    setBusy(true);
    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: conversation })
      });

      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error?.message || "AI request failed");
      }

      const reply = data.choices[0].message.content.trim();
      conversation.push({ role: "assistant", content: reply });

      const jsonMatch = reply.match(/\{[\s\S]*"done"\s*:\s*true[\s\S]*\}/);
      if (jsonMatch) {
        const brief = JSON.parse(jsonMatch[0]);
        document.getElementById("input-controls").style.display = "none";
        addMessage("Thanks! I've organized your project brief and am sending it to our developer now...", "ai");
        await submitToEmail(brief);
      } else {
        addMessage(reply, "ai");
      }
    } catch (err) {
      addMessage(`⚠️ Error: ${err.message}`, "ai");
    } finally {
      setBusy(false);
      document.getElementById("user-input").focus();
    }
  }

  function sendAnswer() {
    submitValue(document.getElementById("user-input").value.trim());
  }

  async function submitToEmail(brief) {
    const payload = {
      access_key: WEB3FORMS_KEY,
      subject: `New Web Dev Inquiry [${brief.project_type || "Project"}] — ${brief.contact || "New Lead"}`,
      from_name: "AI Project Intake",
      "0_AI_Executive_Summary": brief.summary,
      "1_Project_Type": brief.project_type,
      "2_Core_Objective": brief.objective,
      "3_Timeline_and_Budget": brief.constraints,
      "4_Existing_Materials": brief.materials,
      "5_Client_Contact": brief.contact
    };

    try {
      const res = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.success) {
        addMessage("✅ All sent! Your project brief is in our developer's inbox.", "ai");
      } else {
        addMessage("⚠️ Could not send the email. Check your Web3Forms key.", "ai");
      }
    } catch (err) {
      addMessage("⚠️ Network error sending email. Please refresh and try again.", "ai");
    }
  }

  // Browser Speech-to-Text
  let recognition = null;
  let isListening = false;
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.interimResults = false;

    recognition.onresult = (event) => {
      submitValue(event.results[0][0].transcript);
    };
    recognition.onend = () => {
      isListening = false;
      document.getElementById("mic-btn").classList.remove("listening");
    };
  }

  function toggleMic() {
    if (!recognition) {
      alert("Voice input isn't supported in this browser—please type your answer instead.");
      return;
    }
    if (isListening) {
      recognition.stop();
    } else {
      isListening = true;
      document.getElementById("mic-btn").classList.add("listening");
      recognition.start();
    }
  }

  window.addEventListener("DOMContentLoaded", () => {
    addMessage(conversation[1].content, "ai");
  });
</script>
</body>
</html>
